databases:
  - name: vcb-database
    databaseName: vcb_concierge
    user: vcb_admin
    plan: free

services:
  - type: web
    name: vcb-customer-concierge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.web.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vcb-database
          property: connectionString
      - key: MODEL_PROVIDER
        value: openai
      - key: MODEL_BASE_URL
        value: https://loading-shoot-over-tobago.trycloudflare.com/v1
      - key: MODEL_API_KEY
        value: sk-marketing-d682d24e4a3130801e6c7311464ff5152f92fd46ad20fd501a59a11f90186edd
      - key: MODEL_NAME
        value: deepseek/deepseek-v4.1-flash
      - key: AUTO_SEND
        value: "false"
      - key: HOLD_ON_HANDOVER
        value: "true"
