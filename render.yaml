services:
  - type: web
    name: vcb-customer-concierge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.web.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_PROVIDER
        value: openai
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: deepseek/deepseek-v4.1-flash
      - key: AUTO_SEND
        value: "false"
      - key: HOLD_ON_HANDOVER
        value: "true"
